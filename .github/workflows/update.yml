name: Rupeeruchana 4 saatlik analiz

on:
  # 2 Eki 2026: GitHub cron KAPATILDI. Motor artık VPS'teki canlı yürütücüde
  # (scripts/live-executor.mjs) tam mum kapanışında çalışır ve data/'yı push eder.
  # GitHub'ın zamanlanmış işleri 1-2 saat gecikiyordu, bazen tur atlıyordu.
  # Bu workflow artık iki iş yapar: (1) her push'ta siteyi yayınla, (2) elle
  # tetiklenirse motoru burada çalıştır (VPS düşerse yedek).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # type: choice → GitHub açılır liste gösterir; elle 'true' yazmak gerekmez.
      # (Bildirim testi için ayrıca tek tıklık notify-test.yml workflow'u var.)
      test_notify:
        description: 'Bildirim testi: telefona tek mesaj yolla'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  pages: write
  id-token: write

# cancel-in-progress: true ZORUNLU.
# 10 Ağu 2026: bir tur "queued" halinde süresiz asılı kaldı (github-pages ortamında
# durumu hiç gelmeyen bir deployment kaydı ortamı kilitlemişti) ve cancel-in-progress
# false olduğu için sonraki tüm turlar 2 gün boyunca iptal oldu. Yeni tur her zaman
# eskisini devirir: 4 saatte bir çalışan bir motorda taze veri, biten tur'dan önemlidir.
concurrency:
  group: analyze
  cancel-in-progress: true

jobs:
  # 1) VERİ: analiz + commit. Bu job'ın `environment:` tanımı YOK — Pages ortam
  #    kilidi bir daha veri üretimini durduramaz. Site yayını ayrı job'ın işi.
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
      BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
      # Telegram tanımlıysa bildirimler oraya gider, tanımlı değilse ntfy'a düşer.
      # Kurulum: Settings → Secrets and variables → Actions → New repository secret
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Radar (altcoin) sinyalleri için bildirim: '1' açık, '0' kapalı
      RUPEE_RADAR_NOTIFY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kural mantığı testi
        timeout-minutes: 3
        run: node scripts/update.mjs --selftest

      - name: Bildirim testi (yalnızca elle tetiklemede)
        if: ${{ github.event.inputs.test_notify == 'true' }}
        timeout-minutes: 2
        run: node scripts/update.mjs --test-notify

      # Motor yalnızca ELLE tetiklemede çalışır (VPS yedeği). Push'ta sadece yayın.
      - name: Analizi çalıştır
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 10
        run: node scripts/update.mjs

      # Dip radarı 400+ coin tarar, ~1 dakika sürer. continue-on-error: analiz
      # motorunun sağlığı bu taramaya bağlı olmamalı; radar düşerse tur devam eder.
      - name: Dip radarı taraması
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 6
        continue-on-error: true
        run: node scripts/dipradar.mjs

      # Takvim: yeni listeleme / delist tespiti + duyurular + kilit uyarıları.
      # Duyuru kaynağı (www.binance.com) sunuculardan engellenebilir; o durumda
      # modül sembol farkıyla çalışmaya devam eder. Yine de motoru bloke etmesin.
      - name: Takvim / olay taraması
        if: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 4
        continue-on-error: true
        run: node scripts/takvim.mjs

      - name: Değişiklik varsa kaydet
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "rupeeruchana-agent"
          git config user.email "agent@rupeeruchana.local"
          git add data/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "ajan: 4 saatlik analiz $(date -u +'%Y-%m-%d %H:%M UTC')"
          # push yarışı (elle yapılan bir push araya girerse) rebase ile çözülür
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push başarısız (deneme $i) — rebase edip tekrar denenecek"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "push 3 denemede de başarısız oldu"
          exit 1

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 2) YAYIN: yalnızca bu job github-pages ortamına girer. Ortam kilitlenirse
  #    burada asılı kalır, ama veri zaten commit'lendi ve bir sonraki tur
  #    cancel-in-progress ile bu job'ı devirir.
  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
